# Calibration anchors (METHODOLOGY.md 8.2): OpenRouter models that only serve as the ruler for every battery. They
# never get a verdict in an episode table. Ids checked on https://openrouter.ai/api/v1/models on 2026-11-03; every
# anchor run records the id, the date and the price read at run time in meta.json.
# role: "ceiling" (strong, low-cost) or "floor" (deliberately small and weak, with tool calling).
# [anchor.sampling]: pinned like the local models (8.4). OpenRouter accepts temperature, top_p and seed for all three.

[[anchor]]
name = "deepseek/deepseek-v4-pro"
role = "ceiling"

[anchor.sampling]
temperature = 1.0
top_p = 1.0
seed = 2000
source = "DeepSeek-V4-Pro card: temperature = 1.0, top_p = 1.0 (same in generation_config.json)"
card = "https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro"
verified = true

[[anchor]]
name = "z-ai/glm-5.3-flash"
role = "ceiling"

[anchor.sampling]
temperature = 1.0
top_p = 0.95
seed = 2000
source = "Z.AI GLM-5.3-Flash doc: temperature 1, top_p 0.95 (same in generation_config.json)"
card = "https://docs.z.ai/guides/llm/glm-5.3-flash"
verified = true

[[anchor]]
name = "mistralai/ministral-3b-2512"
role = "floor"

[anchor.sampling]
temperature = 0.1
top_p = 1.0
seed = 2000
source = "Ministral 3 3B card: start with temperature 0.1 (its code examples use 0.15); top_p not stated, API default 1.0"
card = "https://huggingface.co/mistralai/Ministral-3-3B-Instruct-2512"
verified = true
