# Models for "What if the floor also reasons?" (PC with an RTX 2060 Super 8 GB): the seven models of episodes 06 and
# 07, same GGUF, pinned sampling and thinking budget, on the v4 batteries of agent, chat_pt and rag. Each model's v4
# score compares with its own v3 score of episode 06. Since episode 07 the PC runs llama.cpp v1.0.0 (episode 07: same
# speed and verdicts as v0.9.0), and the presets of qwen3.6-35b-a3b and gemma4-26b use the MoE cache (episode 07: same
# chat_pt verdicts). `name` is what the server receives in "model" (llama-server preset name in router mode) and
# `gguf` the file. Groups: "small", "medium" and "limit" (larger than 8 GB: part of the model runs on the CPU).

# `[model.sampling]`: pinned sampling sent on every call (METHODOLOGY.md 8.4); `seed` is the base seed, repeat
# n uses seed + n. `source`/`card`/`verified` document where the values come from.

# `thinking = 2048`: every model thinks with a reasoning budget of 2048 tokens, sent per request over the server
# preset's budget (`run` reads it, like `--thinking 2048`). The results name them model@think-2048.

[[model]]
name = "neohorse-4b"
gguf = "NeoHorse-1-4B.i1-Q4_K_M.gguf"
group = "small"
machines = ["pc-rtx2060"]
thinking = 2048

[model.sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repeat_penalty = 1.0
seed = 1000
source = "NeoHorse-1-4B card: reported evaluation protocol (thinking on), not an explicit recommendation; the author's GGUF card uses the same values in its llama-server example"
card = "https://huggingface.co/TokenRhythm/NeoHorse-1-4B"
verified = true

[[model]]
name = "gemma4-e4b"
gguf = "gemma-4-E4B_q4_0-it.gguf"
group = "small"
machines = ["pc-rtx2060"]
thinking = 2048

[model.sampling]
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
presence_penalty = 0.0
seed = 1000
source = "Gemma 4 card: temperature=1.0, top_p=0.95, top_k=64 for all use cases; min_p and penalties not stated, pinned off"
card = "https://huggingface.co/google/gemma-4-E4B-it-qat-q4_0-gguf"
verified = true

[[model]]
name = "lfm3-1.7b"
gguf = "LFM3-1.7B-Q8_0.gguf"
group = "small"
machines = ["pc-rtx2060"]
thinking = 2048

[model.sampling]
temperature = 0.1
top_p = 1.0
top_k = 50
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.1
seed = 1000
source = "LFM3-1.7B card, general set (chat, tool use, agents, coding), reasoning on by default; top_p and min_p not stated, pinned off"
card = "https://huggingface.co/LiquidAI/LFM3-1.7B"
verified = true

[[model]]
name = "ornith1.5-9b"
gguf = "Ornith-1.5-9B-Q4_K_M.gguf"
group = "medium"
machines = ["pc-rtx2060"]
thinking = 2048

[model.sampling]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0
seed = 1000
source = "Ornith 1.5 card, precise coding (thinking on by default); the card's general-task set (temperature 1.0, presence_penalty 1.5) is not used: one set per model"
card = "https://huggingface.co/ornith-ai/Ornith-1.5-9B"
verified = true

# The base of ornith1.5-9b (same Q4_K_M quant, from unsloth: Qwen publishes no GGUF of it), to compare base and
# fine-tune on the same card.
[[model]]
name = "gemma4-12b"
gguf = "gemma-4-12B-it-qat-UD-Q4_K_XL.gguf"
group = "medium"
machines = ["pc-rtx2060", "runpod"]
thinking = 2048

[model.sampling]
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
presence_penalty = 0.0
seed = 1000
source = "Gemma 4 card: temperature=1.0, top_p=0.95, top_k=64 for all use cases; min_p and penalties not stated, pinned off"
card = "https://huggingface.co/google/gemma-4-12B-it-qat-q4_0-unquantized"
verified = true

# 13 GB file: larger than the 8 GB card, so most layers run on the CPU (-ngl below 99 in the preset).
# 35B MoE with ~3B active: on 8 GB, with the experts on the CPU (--n-cpu-moe in the preset).
[[model]]
name = "qwen3.6-35b-a3b"
gguf = "Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf"
group = "limit"
machines = ["pc-rtx2060"]
thinking = 2048

[model.sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repeat_penalty = 1.0
seed = 1000
source = "Qwen3.6 card, thinking mode, general tasks: temperature=1.0, top_p=0.95, top_k=20, min_p=0.0, presence_penalty=1.5, repetition_penalty=1.0. Not the card's precise-coding set (temperature 0.6, no presence_penalty): with it the model looped and ran out of tokens on trivial prompts on the PC"
card = "https://huggingface.co/Qwen/Qwen3.6-35B-A3B"
verified = true

# 26B MoE with ~3.8B active (QAT q4_0, 13.45 GiB): on 8 GB, part of the experts in RAM (the router's --fit).
[[model]]
name = "gemma4-26b"
gguf = "gemma-4-26B_q4_0-it.gguf"
group = "limit"
machines = ["pc-rtx2060"]
thinking = 2048

[model.sampling]
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
presence_penalty = 0.0
