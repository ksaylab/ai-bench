# Models for "What runs on 8 GB?" (PC with an RTX 2060 Super 8 GB). `name` is what the server receives in
# "model" (llama-server preset name in router mode, or the Ollama tag) and `gguf` is the file `speed` measures
# (looked up in --models-dir). `machines`: where the model runs by default.
# Groups: "small" (fits easily in 8 GB of VRAM), "medium" (fits, tight) and "limit" (larger than 8 GB: part of
# the model runs on the CPU; tests whether it is still usable).

# `[model.sampling]`: pinned sampling sent on every call (METHODOLOGY.md 8.4); `seed` is the base seed, repeat
# n uses seed + n. `source`/`card`/`verified` document where the values come from.

[[model]]
name = "neohorse-4b"
gguf = "NeoHorse-1-4B.i1-Q4_K_M.gguf"
group = "small"
machines = ["pc-rtx2060"]

[model.sampling]   # replace with the model card's recommended settings, then set verified = true
temperature = 0.7
top_p = 0.95
top_k = 40
min_p = 0.05
presence_penalty = 0.0
seed = 1000
source = "generic default (no recommended settings found yet)"
card = ""
verified = false

