# Models for "What runs on 8 GB?" (PC with an RTX 2060 Super 8 GB). `name` is what the server receives in "model" (llama-server
# preset name in router mode, or the Ollama tag) and `gguf` is the file `speed` measures (looked up in
# --models-dir). `machines`: where the model runs by default.
# Groups: "small" (fits easily in 8 GB of VRAM), "medium" (fits, tight) and "limit" (larger than 8 GB: part of
# the model runs on the CPU; tests whether it is still usable).

[[model]]
name = "neohorse-4b"
gguf = "NeoHorse-1-4B.i1-Q4_K_M.gguf"
group = "small"
machines = ["pc-rtx2060"]

[[model]]
name = "gemma4-e4b"
gguf = "gemma-4-E4B_q4_0-it.gguf"
group = "small"
machines = ["pc-rtx2060"]

[[model]]
name = "ornith1.5-9b"
gguf = "Ornith-1.5-9B-Q4_K_M.gguf"
group = "medium"
machines = ["pc-rtx2060"]

[[model]]
name = "gemma4-12b"
gguf = "gemma-4-12B-it-qat-UD-Q4_K_XL.gguf"
group = "medium"
machines = ["pc-rtx2060", "runpod"]

# 13 GB file: larger than the 8 GB card, so most layers run on the CPU (-ngl below 99 in the preset).
[[model]]
name = "qwen3.8-27b-q3"
gguf = "Qwen3.8-27B-UD-Q3_K_XL.gguf"
group = "limit"
machines = ["pc-rtx2060"]

# 35B MoE with ~3B active: on 8 GB, with the experts on the CPU (--n-cpu-moe in the preset).
[[model]]
name = "qwen3.6-35b-a3b"
gguf = "Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf"
group = "limit"
machines = ["pc-rtx2060"]
