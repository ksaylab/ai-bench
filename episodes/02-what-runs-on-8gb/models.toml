# Models for "What runs on 8 GB?" (PC with an RTX 2060 Super 8 GB). `name` is what the server receives in
# "model" (llama-server preset name in router mode, or the Ollama tag) and `gguf` is the file `speed` measures
# (looked up in --models-dir). `machines`: where the model runs by default.
# Groups: "small" (fits easily in 8 GB of VRAM), "medium" (fits, tight) and "limit" (larger than 8 GB: part of
# the model runs on the CPU; tests whether it is still usable).

# `[model.sampling]`: pinned sampling sent on every call (METHODOLOGY.md 8.4); `seed` is the base seed, repeat
# n uses seed + n. `source`/`card`/`verified` document where the values come from.

[[model]]
name = "neohorse-4b"
gguf = "NeoHorse-1-4B.i1-Q4_K_M.gguf"
group = "small"
machines = ["pc-rtx2060"]

[model.sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repeat_penalty = 1.0
seed = 1000
source = "NeoHorse-1-4B card: reported evaluation protocol (thinking on), not an explicit recommendation; the author's GGUF card uses the same values in its llama-server example"
card = "https://huggingface.co/TokenRhythm/NeoHorse-1-4B"
verified = true

[[model]]
name = "gemma4-e4b"
gguf = "gemma-4-E4B_q4_0-it.gguf"
group = "small"
machines = ["pc-rtx2060"]

[model.sampling]
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
presence_penalty = 0.0
seed = 1000
source = "Gemma 4 card: temperature=1.0, top_p=0.95, top_k=64 for all use cases; min_p and penalties not stated, pinned off"
card = "https://huggingface.co/google/gemma-4-E4B-it-qat-q4_0-gguf"
verified = true

