# Models for "Buy or rent a GPU?": the same models on every rented GPU (machine runpod), so speed, cost and
# the verdict can be compared card by card. `name` is what the server receives in "model" (llama-server preset).

# `[model.sampling]`: pinned sampling sent on every call (METHODOLOGY.md 8.4); `seed` is the base seed, repeat
# n uses seed + n. `source`/`card`/`verified` document where the values come from.

[[model]]
name = "gemma4-12b"
gguf = "gemma-4-12B-it-qat-UD-Q4_K_XL.gguf"
group = "16gb"
machines = ["runpod"]

[model.sampling]
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
presence_penalty = 0.0
seed = 1000
source = "Gemma 4 card: temperature=1.0, top_p=0.95, top_k=64 for all use cases; min_p and penalties not stated, pinned off"
card = "https://huggingface.co/google/gemma-4-12B-it-qat-q4_0-unquantized"
verified = true

[[model]]
name = "qwen3.8-27b-q3"
gguf = "Qwen3.8-27B-UD-Q3_K_XL.gguf"
group = "24gb"
machines = ["runpod"]

[model.sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0
seed = 1000
source = "Qwen3.8 card, thinking mode (the default)"
card = "https://huggingface.co/Qwen/Qwen3.8-27B"
verified = true

