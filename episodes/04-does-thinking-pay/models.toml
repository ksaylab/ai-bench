# Models for "Does thinking pay?" (PC with an RTX 2060 Super 8 GB): the six models the PC serves, with the same
# GGUF and pinned sampling as episode 02. Each one runs once per thinking level (`run --thinking off|512|2048|8192`,
# max_tokens 32768 for every level), and each level is its own contestant in the results:
# model@think-<level>. The question: how much does thinking raise the score, and what does it cost in time?
# Groups as in episode 02: "small", "medium" and "limit" (larger than 8 GB: part of the model runs on the CPU).

[[model]]
name = "lfm3-1.7b"
gguf = "LFM3-1.7B-Q8_0.gguf"
group = "small"
machines = ["pc-rtx2060"]

[model.sampling]
temperature = 0.1
top_p = 1.0
top_k = 50
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.1
seed = 1000
source = "LFM3-1.7B card, general set (chat, tool use, agents, coding), reasoning on by default; top_p and min_p not stated, pinned off"
card = "https://huggingface.co/LiquidAI/LFM3-1.7B"
verified = true

