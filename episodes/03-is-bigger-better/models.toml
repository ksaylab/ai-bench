# Models for "Is a bigger model better?": small x large pairs on the SAME hardware. `pair` groups the comparison.
# `name`: what the server receives in "model" (llama-server preset or Ollama tag).

# `[model.sampling]`: pinned sampling sent on every call (METHODOLOGY.md 8.4); `seed` is the base seed, repeat
# n uses seed + n. `source`/`card`/`verified` document where the values come from.

[[model]]
name = "neohorse-4b"
gguf = "NeoHorse-1-4B.i1-Q4_K_M.gguf"
pair = "4b-vs-35b"
group = "small"
machines = ["pc-rtx2060"]

[model.sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repeat_penalty = 1.0
seed = 1000
source = "NeoHorse-1-4B card: reported evaluation protocol (thinking on), not an explicit recommendation; the author's GGUF card uses the same values in its llama-server example"
card = "https://huggingface.co/TokenRhythm/NeoHorse-1-4B"
verified = true

